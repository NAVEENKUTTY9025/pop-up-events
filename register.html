<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Register | Vendora — Premium Pop-Up Market & Event Vendor Platform</title>
  <link rel="icon" type="image/jpeg" href="images/fav.webp">
  <meta name="description" content="Create your Vendora vendor account. Join India's premier pop-up market platform for luxury artisans and brands.">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Light mode (default) */
    :root {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F8F8F4;
      --bg-card: #FFFFFF;
      --text-primary: #1a1a1a;
      --text-secondary: #4a4a4a;
      --text-muted: #6b6b6b;
      --border-color: #e5e5e5;
      --gold: #C19A6B;
      --gold-light: #d4af7a;
      --gold-dark: #a07e50;
      --shadow: 0 20px 35px -8px rgba(0,0,0,0.08), 0 5px 12px -4px rgba(0,0,0,0.04);
      --input-bg: #FFFFFF;
      --input-border: #e0e0e0;
      --icon-btn-bg: rgba(193, 154, 107, 0.12);
      --icon-btn-border: rgba(193, 154, 107, 0.25);
      --icon-btn-hover-bg: #C19A6B;
      --icon-btn-hover-color: #0D0D0D;
    }

    /* Dark mode — enhanced contrast */
    body.dark {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-card: #0c0c0c;
      --text-primary: #F5F5F5;
      --text-secondary: #CCCCCC;
      --text-muted: #A0A0A0;
      --border-color: #2a2a2a;
      --gold: #D4AF7A;
      --gold-light: #e2c293;
      --gold-dark: #b8945c;
      --shadow: 0 20px 35px -8px rgba(0,0,0,0.7), 0 5px 12px -4px rgba(0,0,0,0.5);
      --input-bg: #111111;
      --input-border: #2c2c2c;
      --icon-btn-bg: rgba(212, 175, 122, 0.18);
      --icon-btn-border: rgba(212, 175, 122, 0.4);
      --icon-btn-hover-bg: #D4AF7A;
      --icon-btn-hover-color: #000000;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* subtle gradient overlay only in light mode */
    body:not(.dark) {
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
    }

    .gold-text {
      color: var(--gold);
    }

    /* Top Bar - Clean, minimal */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.5rem;
      background: transparent;
      z-index: 100;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.5px;
      transition: opacity 0.3s ease;
    }

    .logo span {
      color: var(--gold);
      font-style: italic;
      font-family: 'Merriweather', serif;
    }

    .controls {
      display: flex;
      gap: 0.7rem;
      align-items: center;
    }

    /* Enhanced icon buttons - perfect contrast */
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--icon-btn-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      border: 1.5px solid var(--icon-btn-border);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.4, 1);
      font-size: 1rem;
      backdrop-filter: blur(2px);
    }

    .icon-btn:hover {
      background: var(--icon-btn-hover-bg);
      color: var(--icon-btn-hover-color);
      border-color: var(--icon-btn-hover-bg);
      transform: scale(1.08);
    }

    body.dark .icon-btn i {
      color: #E8E8E8;
    }

    body.dark .icon-btn:hover i {
      color: #000000;
    }

    /* Main Register Container - Perfectly Centered */
    .register-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      padding: 0 1rem;
    }

    /* Tightened Register Card - Centered, compact, neat */
    .register-card {
      background: var(--bg-card);
      border-radius: 28px;
      padding: 1.4rem 1.5rem 1.6rem 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      animation: fadeInUp 0.5s ease-out;
      margin: 0 auto;
    }

    body.dark .register-card {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #0c0c0c;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .register-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .register-header {
      text-align: center;
      margin-bottom: 1.2rem;
    }

    .register-header h1 {
      font-size: 1.6rem;
      font-family: 'Merriweather', serif;
      margin-bottom: 0.25rem;
      letter-spacing: -0.3px;
    }

    .register-header p {
      color: var(--text-secondary);
      font-size: 0.75rem;
      margin-top: 0.1rem;
    }

    .gold-divider {
      width: 50px;
      height: 2.5px;
      background: var(--gold);
      margin: 0.5rem auto 0.15rem auto;
      border-radius: 2px;
    }

    /* Form Styles - Tight but readable */
    .input-group {
      margin-bottom: 0.9rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 500;
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.2px;
    }

    .input-group .label-icon {
      margin-right: 5px;
      color: var(--gold);
      font-size: 0.7rem;
    }

    .input-field {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      font-size: 0.82rem;
      color: var(--text-primary);
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }

    body.dark .input-field {
      background: #111111;
      border-color: #2c2c2c;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(193, 154, 107, 0.12);
    }

    body.dark .input-field:focus {
      box-shadow: 0 0 0 3px rgba(212, 175, 122, 0.18);
    }

    .input-field::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
      font-size: 0.75rem;
    }

    /* Terms Checkbox - Compact */
    .terms-group {
      margin: 0.8rem 0 0.9rem 0;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.7rem;
    }

    .checkbox input {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: var(--gold);
      flex-shrink: 0;
    }

    .checkbox a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
    }

    .checkbox a:hover {
      text-decoration: underline;
    }

    /* Register Button - Compact */
    .btn-register {
      width: 100%;
      background: var(--gold);
      color: #0D0D0D;
      font-weight: 700;
      padding: 0.7rem;
      border-radius: 40px;
      border: none;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.2px;
    }

    .btn-register:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(193, 154, 107, 0.25);
    }

    body.dark .btn-register:hover {
      box-shadow: 0 6px 16px rgba(212, 175, 122, 0.3);
    }

    /* Divider - Compact */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1rem 0 0.9rem 0;
      color: var(--text-muted);
      font-size: 0.65rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider span {
      padding: 0 0.8rem;
      font-weight: 500;
    }

    /* Social Register - Compact */
    .social-register {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0.55rem 0;
      background: transparent;
      border: 1.5px solid var(--border-color);
      border-radius: 40px;
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }

    body.dark .social-btn {
      background: rgba(20, 20, 20, 0.6);
      border-color: #2c2c2c;
    }

    .social-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-2px);
      background: rgba(193, 154, 107, 0.05);
    }

    body.dark .social-btn:hover {
      background: rgba(212, 175, 122, 0.1);
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .social-btn i {
      font-size: 0.85rem;
    }

    body.dark .social-btn i {
      color: #CCCCCC;
    }

    body.dark .social-btn:hover i {
      color: var(--gold-light);
    }

    /* Login Link - Compact */
    .login-link {
      text-align: center;
      margin-top: 1.1rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.74rem;
      color: var(--text-secondary);
    }

    .login-link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 700;
      margin-left: 4px;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    /* Notification styling */
    .custom-notification {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 20px;
      border-radius: 60px;
      font-size: 0.78rem;
      font-weight: 500;
      z-index: 2000;
      min-width: 210px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      backdrop-filter: blur(12px);
      font-family: 'Inter', sans-serif;
      transition: opacity 0.25s;
    }

    /* Responsive - Mobile Tightening */
    @media (max-width: 480px) {
      .top-bar {
        padding: 0 1rem;
        height: 56px;
      }
      .logo {
        font-size: 1.4rem;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        font-size: 0.85rem;
      }
      .register-container {
        padding: 0 0.85rem;
      }
      .register-card {
        padding: 1.2rem 1.2rem 1.4rem 1.2rem;
        max-width: 100%;
        border-radius: 24px;
      }
      .register-header h1 {
        font-size: 1.45rem;
      }
      .register-header p {
        font-size: 0.7rem;
      }
      .gold-divider {
        width: 45px;
        margin: 0.45rem auto 0.1rem auto;
      }
      .input-group {
        margin-bottom: 0.8rem;
      }
      .input-field {
        padding: 0.58rem 0.8rem;
        font-size: 0.8rem;
      }
      .btn-register {
        padding: 0.62rem;
        font-size: 0.8rem;
      }
      .divider {
        margin: 0.9rem 0 0.8rem 0;
      }
      .social-btn {
        padding: 0.5rem 0;
        font-size: 0.68rem;
        gap: 5px;
      }
      .login-link {
        margin-top: 1rem;
        padding-top: 0.8rem;
        font-size: 0.7rem;
      }
      .terms-group {
        margin: 0.7rem 0 0.8rem 0;
      }
      .checkbox {
        font-size: 0.67rem;
        gap: 6px;
      }
    }

    @media (max-width: 380px) {
      .register-card {
        padding: 1rem 1rem 1.2rem 1rem;
      }
      .social-register {
        flex-direction: column;
        gap: 0.55rem;
      }
      .social-btn {
        justify-content: center;
      }
      .register-header h1 {
        font-size: 1.35rem;
      }
    }

    /* RTL specific adjustments */
    [dir="rtl"] .input-group label .label-icon {
      margin-left: 5px;
      margin-right: 0;
    }
    
    [dir="rtl"] .checkbox {
      flex-direction: row-reverse;
      justify-content: flex-end;
    }
    
    [dir="rtl"] .checkbox input {
      margin-left: 7px;
      margin-right: 0;
    }
    
    [dir="rtl"] .btn-register i,
    [dir="rtl"] .social-btn i {
      margin-left: 6px;
      margin-right: 0;
    }
    
    [dir="rtl"] .login-link a {
      margin-left: 0;
      margin-right: 4px;
    }
    
    [dir="rtl"] .gold-divider {
      margin: 0.5rem auto 0.15rem auto;
    }
    
    [dir="rtl"] .controls {
      flex-direction: row;
    }
  </style>
</head>
<body>

<!-- Top Bar - Clean with fixed contrast -->
<div class="top-bar">
  <a href="index.html" class="logo"><span>Vendora</span></a>
  <div class="controls">
    <button id="rtl-toggle" class="icon-btn" title="RTL Mode" aria-label="Toggle RTL"><i class="fas fa-exchange-alt"></i></button>
    <button id="theme-toggle" class="icon-btn" title="Dark/Light Mode" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
  </div>
</div>

<!-- Register Container - Perfectly Centered -->
<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h1>Create <span class="gold-text">Account</span></h1>
      <div class="gold-divider"></div>
      <p>Join Vendora's premium vendor community</p>
    </div>

    <form id="registerForm" onsubmit="return handleRegister(event)">
      <!-- First Name -->
      <div class="input-group">
        <label><i class="fas fa-user label-icon"></i> First Name</label>
        <input type="text" class="input-field" id="firstname" placeholder="John" required>
      </div>

      <!-- Last Name -->
      <div class="input-group">
        <label><i class="fas fa-user label-icon"></i> Last Name</label>
        <input type="text" class="input-field" id="lastname" placeholder="Doe" required>
      </div>

      <!-- Email -->
      <div class="input-group">
        <label><i class="fas fa-envelope label-icon"></i> Email</label>
        <input type="email" class="input-field" id="email" placeholder="hello@vendora.com" required>
      </div>

      <!-- Password -->
      <div class="input-group">
        <label><i class="fas fa-lock label-icon"></i> Password</label>
        <input type="password" class="input-field" id="password" placeholder="•••••••• (min. 6 characters)" required>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <label><i class="fas fa-check-circle label-icon"></i> Confirm Password</label>
        <input type="password" class="input-field" id="confirm_password" placeholder="••••••••" required>
      </div>

      <!-- Terms Checkbox -->
      <div class="terms-group">
        <label class="checkbox">
          <input type="checkbox" id="terms" required>
          <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </label>
      </div>

      <!-- Register Button -->
      <button type="submit" class="btn-register">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span>or sign up with</span>
    </div>

    <!-- Social Register -->
    <div class="social-register">
      <a href="#" class="social-btn" onclick="socialRegister(event, 'google')">
        <i class="fab fa-google"></i> Google
      </a>
      <a href="#" class="social-btn" onclick="socialRegister(event, 'facebook')">
        <i class="fab fa-facebook-f"></i> Facebook
      </a>
      <a href="#" class="social-btn" onclick="socialRegister(event, 'apple')">
        <i class="fab fa-apple"></i> Apple
      </a>
    </div>

    <!-- Login Link -->
    <div class="login-link">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- DARK MODE with fixed contrast ----------
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;
    
    function updateThemeIcon(isDark) {
      if(themeToggle) {
        themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      }
    }
    
    function setTheme(theme) {
      if(theme === 'dark') {
        body.classList.add('dark');
        updateThemeIcon(true);
        localStorage.setItem('theme', 'dark');
      } else {
        body.classList.remove('dark');
        updateThemeIcon(false);
        localStorage.setItem('theme', 'light');
      }
    }
    
    const savedTheme = localStorage.getItem('theme');
    if(savedTheme === 'dark') {
      setTheme('dark');
    } else if(savedTheme === 'light') {
      setTheme('light');
    } else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      setTheme('dark');
    } else {
      setTheme('light');
    }
    
    themeToggle?.addEventListener('click', () => {
      const isDarkNow = body.classList.contains('dark');
      setTheme(isDarkNow ? 'light' : 'dark');
    });
    
    // ---------- RTL TOGGLE with perfect alignment ----------
    const rtlToggle = document.getElementById('rtl-toggle');
    const htmlEl = document.documentElement;
    
    function applyRTLSpecifics(isRTL) {
      const allInputs = document.querySelectorAll('.input-field, .btn-register, .social-btn');
      allInputs.forEach(el => {
        if(isRTL) el.style.textAlign = 'right';
        else el.style.textAlign = '';
      });
      const checkboxes = document.querySelectorAll('.checkbox');
      checkboxes.forEach(cb => {
        if(isRTL) {
          cb.style.direction = 'rtl';
          cb.style.justifyContent = 'flex-end';
        } else {
          cb.style.direction = '';
          cb.style.justifyContent = '';
        }
      });
      const labelIcons = document.querySelectorAll('.label-icon');
      labelIcons.forEach(icon => {
        if(isRTL) {
          icon.style.marginLeft = '5px';
          icon.style.marginRight = '0';
        } else {
          icon.style.marginLeft = '';
          icon.style.marginRight = '';
        }
      });
    }
    
    function toggleRTL() {
      if(htmlEl.getAttribute('dir') === 'rtl') {
        htmlEl.removeAttribute('dir');
        localStorage.setItem('direction', 'ltr');
        applyRTLSpecifics(false);
      } else {
        htmlEl.setAttribute('dir', 'rtl');
        localStorage.setItem('direction', 'rtl');
        applyRTLSpecifics(true);
      }
    }
    
    if(localStorage.getItem('direction') === 'rtl') {
      htmlEl.setAttribute('dir', 'rtl');
      applyRTLSpecifics(true);
    }
    
    rtlToggle?.addEventListener('click', toggleRTL);
    
    // ---------- Notification System ----------
    function showNotification(message, type = 'info') {
      const existing = document.querySelector('.custom-notification');
      if(existing) existing.remove();
      
      const notif = document.createElement('div');
      notif.className = 'custom-notification';
      let icon = 'fa-info-circle';
      let bgColor = '#C19A6B';
      let textColor = '#0D0D0D';
      
      if(type === 'success') {
        icon = 'fa-check-circle';
        bgColor = '#10b981';
        textColor = '#ffffff';
      } else if(type === 'error') {
        icon = 'fa-exclamation-circle';
        bgColor = '#ef4444';
        textColor = '#ffffff';
      } else {
        icon = 'fa-info-circle';
        bgColor = 'var(--gold)';
        textColor = '#0D0D0D';
      }
      
      notif.style.backgroundColor = bgColor;
      notif.style.color = textColor;
      notif.innerHTML = `<i class="fas ${icon}" style="margin-right: 7px;"></i> ${message}`;
      document.body.appendChild(notif);
      
      setTimeout(() => {
        notif.style.opacity = '0';
        setTimeout(() => {
          if(notif.parentNode) notif.remove();
        }, 250);
      }, 2600);
    }
    
    // ---------- Register Handler ----------
    window.handleRegister = function(event) {
      event.preventDefault();
      
      const firstname = document.getElementById('firstname').value.trim();
      const lastname = document.getElementById('lastname').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const terms = document.getElementById('terms').checked;
      
      if(!firstname) {
        showNotification('Please enter your first name', 'error');
        return false;
      }
      if(!lastname) {
        showNotification('Please enter your last name', 'error');
        return false;
      }
      if(!email) {
        showNotification('Please enter your email address', 'error');
        return false;
      }
      if(!email.includes('@') || !email.includes('.')) {
        showNotification('Please enter a valid email address', 'error');
        return false;
      }
      if(!password) {
        showNotification('Please create a password', 'error');
        return false;
      }
      if(password.length < 6) {
        showNotification('Password must be at least 6 characters', 'error');
        return false;
      }
      if(password !== confirmPassword) {
        showNotification('Passwords do not match', 'error');
        return false;
      }
      if(!terms) {
        showNotification('Please accept the Terms of Service', 'error');
        return false;
      }
      
      console.log('Registration:', { firstname, lastname, email });
      showNotification('Account created successfully! Redirecting to login...', 'success');
      localStorage.setItem('vendora_registered_email', email);
      
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
      return false;
    };
    
    window.socialRegister = function(event, provider) {
      event.preventDefault();
      showNotification(`${provider} sign up coming soon`, 'info');
    };
    
    // Password match validation
    const passwordField = document.getElementById('password');
    const confirmField = document.getElementById('confirm_password');
    
    function validatePasswordMatch() {
      if(confirmField.value.length > 0) {
        if(passwordField.value !== confirmField.value) {
          confirmField.style.borderColor = '#ef4444';
        } else {
          confirmField.style.borderColor = 'var(--gold)';
        }
      } else {
        confirmField.style.borderColor = 'var(--input-border)';
      }
    }
    
    passwordField?.addEventListener('keyup', validatePasswordMatch);
    confirmField?.addEventListener('keyup', validatePasswordMatch);
    
    const registerForm = document.getElementById('registerForm');
    if(registerForm) {
      registerForm.addEventListener('keypress', function(e) {
        if(e.key === 'Enter') {
          handleRegister(e);
        }
      });
    }
    
    window.addEventListener('resize', () => {
      if(htmlEl.getAttribute('dir') === 'rtl') {
        applyRTLSpecifics(true);
      }
    });
  })();
</script>
</body>
</html>
