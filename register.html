<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Register | Vendora — Premium Pop-Up Market & Event Vendor Platform</title>
   <link rel="icon" type="image/jpeg" href="images/fav.webp">
  <meta name="description" content="Create your Vendora vendor account. Join India's premier pop-up market platform for luxury artisans and brands.">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Light mode (default) */
    :root {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F8F8F4;
      --bg-card: #FFFFFF;
      --text-primary: #1a1a1a;
      --text-secondary: #4a4a4a;
      --text-muted: #6b6b6b;
      --border-color: #e5e5e5;
      --gold: #C19A6B;
      --gold-light: #d4af7a;
      --gold-dark: #a07e50;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --input-bg: #FFFFFF;
      --input-border: #e0e0e0;
    }

    /* Dark mode */
    body.dark {
      --bg-primary: #0D0D0D;
      --bg-secondary: #0a0a0a;
      --bg-card: #141414;
      --text-primary: #FFFFFF;
      --text-secondary: #cccccc;
      --text-muted: #999999;
      --border-color: #2a2a2a;
      --gold: #C19A6B;
      --gold-light: #d4af7a;
      --shadow: 0 10px 30px rgba(0,0,0,0.5);
      --input-bg: #1a1a1a;
      --input-border: #333333;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    .gold-text {
      color: var(--gold);
    }

    /* Top Bar - Clean, No Background */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2.5rem;
      background: transparent;
      z-index: 100;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.5px;
      transition: opacity 0.3s ease;
    }

    .logo span {
      color: var(--gold);
      font-style: italic;
      font-family: 'Merriweather', serif;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(193, 154, 107, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      border: 1px solid rgba(193, 154, 107, 0.25);
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .icon-btn:hover {
      background: var(--gold);
      color: #0D0D0D;
      border-color: var(--gold);
      transform: scale(1.05);
    }

    /* Main Register Container - Perfectly Centered */
    .register-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      padding: 0 1.5rem;
    }

    /* Tightened Register Card - No Scroll */
    .register-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 1.5rem 2rem 1.8rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
      animation: fadeInUp 0.5s ease-out;
      overflow: visible;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .register-card:hover {
      border-color: var(--gold);
      transform: translateY(-3px);
    }

    .register-header {
      text-align: center;
      margin-bottom: 1.2rem;
    }

    .register-header h1 {
      font-size: 1.6rem;
      font-family: 'Merriweather', serif;
      margin-bottom: 0.2rem;
    }

    .register-header p {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .gold-divider {
      width: 45px;
      height: 2px;
      background: var(--gold);
      margin: 0.5rem auto 0;
    }

    /* Form Styles - One by One Inputs */
    .input-group {
      margin-bottom: 0.9rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 500;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .input-group .label-icon {
      margin-right: 6px;
      color: var(--gold);
      font-size: 0.75rem;
    }

    .input-field {
      width: 100%;
      padding: 0.65rem 1rem;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      font-size: 0.85rem;
      color: var(--text-primary);
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(193, 154, 107, 0.15);
    }

    .input-field::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
      font-size: 0.8rem;
    }

    select.input-field {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C19A6B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1rem;
    }

    /* Terms Checkbox */
    .terms-group {
      margin: 1rem 0 1rem 0;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.7rem;
    }

    .checkbox input {
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: var(--gold);
      flex-shrink: 0;
    }

    .checkbox a {
      color: var(--gold);
      text-decoration: none;
    }

    .checkbox a:hover {
      text-decoration: underline;
    }

    /* Register Button */
    .btn-register {
      width: 100%;
      background: var(--gold);
      color: #0D0D0D;
      font-weight: 600;
      padding: 0.7rem;
      border-radius: 10px;
      border: none;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
    }

    .btn-register:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(193, 154, 107, 0.25);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1rem 0;
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider span {
      padding: 0 1rem;
    }

    /* Social Register */
    .social-register {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.55rem;
      background: transparent;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .social-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-2px);
    }

    .social-btn i {
      font-size: 0.9rem;
    }

    /* Login Link */
    .login-link {
      text-align: center;
      margin-top: 1rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .login-link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    /* Demo Hint */
    .demo-hint {
      background: rgba(193, 154, 107, 0.08);
      border-radius: 8px;
      padding: 0.5rem;
      margin-top: 0.9rem;
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-muted);
      border-left: 3px solid var(--gold);
    }

    .demo-hint i {
      color: var(--gold);
      margin-right: 5px;
      font-size: 0.65rem;
    }

    /* No scroll - body fixed */
    body {
      overflow: hidden;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .top-bar {
        padding: 0 1.2rem;
        height: 60px;
      }
      .logo {
        font-size: 1.4rem;
      }
      .register-card {
        padding: 1.2rem 1.5rem 1.5rem 1.5rem;
        max-width: 360px;
      }
      .register-header h1 {
        font-size: 1.4rem;
      }
      .register-header p {
        font-size: 0.7rem;
      }
      .input-field {
        padding: 0.55rem 0.9rem;
        font-size: 0.8rem;
      }
      .btn-register {
        padding: 0.6rem;
        font-size: 0.8rem;
      }
      .social-btn {
        padding: 0.45rem;
        font-size: 0.7rem;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 380px) {
      .social-register {
        flex-direction: column;
        gap: 0.5rem;
      }
      .register-card {
        max-width: 320px;
        padding: 1rem 1.2rem 1.3rem 1.2rem;
      }
    }
  </style>
</head>
<body>

<!-- Top Bar - Clean, No Background, Just Logo and Controls -->
<div class="top-bar">
  <a href="index.html" class="logo"><span>Vendora</span></a>
  <div class="controls">
    <button id="rtl-toggle" class="icon-btn" title="RTL Mode"><i class="fas fa-exchange-alt"></i></button>
    <button id="theme-toggle" class="icon-btn" title="Dark/Light Mode"><i class="fas fa-moon"></i></button>
  </div>
</div>

<!-- Register Container - Perfectly Centered -->
<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h1>Create <span class="gold-text">Account</span></h1>
      <div class="gold-divider"></div>
      <p>Join Vendora's premium vendor community</p>
    </div>

    <form id="registerForm" onsubmit="return handleRegister(event)">
      <!-- First Name -->
      <div class="input-group">
        <label><i class="fas fa-user label-icon"></i> First Name</label>
        <input type="text" class="input-field" id="firstname" placeholder="John" required>
      </div>

      <!-- Last Name -->
      <div class="input-group">
        <label><i class="fas fa-user label-icon"></i> Last Name</label>
        <input type="text" class="input-field" id="lastname" placeholder="Doe" required>
      </div>

     
      <!-- Password -->
      <div class="input-group">
        <label><i class="fas fa-lock label-icon"></i> Password</label>
        <input type="password" class="input-field" id="password" placeholder="•••••••• (min. 6 characters)" required>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <label><i class="fas fa-check-circle label-icon"></i> Confirm Password</label>
        <input type="password" class="input-field" id="confirm_password" placeholder="••••••••" required>
      </div>

      <!-- Terms Checkbox -->
      <div class="terms-group">
        <label class="checkbox">
          <input type="checkbox" id="terms" required>
          <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </label>
      </div>

      <!-- Register Button -->
      <button type="submit" class="btn-register">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <!-- Divider -->
    <div class="divider">
      <span>or sign up with</span>
    </div>

    <!-- Social Register -->
    <div class="social-register">
      <a href="#" class="social-btn" onclick="socialRegister(event, 'google')">
        <i class="fab fa-google"></i> Google
      </a>
      <a href="#" class="social-btn" onclick="socialRegister(event, 'facebook')">
        <i class="fab fa-facebook-f"></i> Facebook
      </a>
      <a href="#" class="social-btn" onclick="socialRegister(event, 'apple')">
        <i class="fab fa-apple"></i> Apple
      </a>
    </div>

    <!-- Login Link -->
    <div class="login-link">
      Already have an account? <a href="login.html">Sign In</a>
    </div>

    <!-- Demo Hint -->
   
  </div>
</div>

<script>
  // Theme Toggle
  const themeToggle = document.getElementById('theme-toggle');
  const body = document.body;
  
  function updateThemeIcon(isDark) {
    if(themeToggle) {
      themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }
  }
  
  function toggleTheme() {
    body.classList.toggle('dark');
    localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
    updateThemeIcon(body.classList.contains('dark'));
  }
  
  // Check for saved theme preference
  if(localStorage.getItem('theme') === 'dark') {
    body.classList.add('dark');
    updateThemeIcon(true);
  } else if(window.matchMedia('(prefers-color-scheme: dark)').matches && !localStorage.getItem('theme')) {
    body.classList.add('dark');
    updateThemeIcon(true);
  }
  
  themeToggle?.addEventListener('click', toggleTheme);
  
  // RTL Toggle
  const rtlToggle = document.getElementById('rtl-toggle');
  const htmlEl = document.documentElement;
  
  function applyRTLStyles(isRTL) {
    const elements = document.querySelectorAll('.input-field, .btn-register, .social-btn, .login-link, .demo-hint, .checkbox span');
    elements.forEach(el => {
      if(isRTL) {
        el.style.textAlign = 'right';
      } else {
        el.style.textAlign = '';
      }
    });
    
    const checkboxes = document.querySelectorAll('.checkbox');
    checkboxes.forEach(cb => {
      if(isRTL) {
        cb.style.direction = 'rtl';
        cb.style.justifyContent = 'flex-end';
      } else {
        cb.style.direction = '';
        cb.style.justifyContent = '';
      }
    });
    
    const labelIcons = document.querySelectorAll('.label-icon');
    labelIcons.forEach(icon => {
      if(isRTL) {
        icon.style.marginLeft = '6px';
        icon.style.marginRight = '0';
      } else {
        icon.style.marginLeft = '';
        icon.style.marginRight = '';
      }
    });
    
    const demoIcon = document.querySelector('.demo-hint i');
    if(demoIcon) {
      if(isRTL) {
        demoIcon.style.marginLeft = '5px';
        demoIcon.style.marginRight = '0';
      } else {
        demoIcon.style.marginLeft = '';
        demoIcon.style.marginRight = '';
      }
    }
    
    // Fix select dropdown arrow position for RTL
    const selectFields = document.querySelectorAll('select.input-field');
    selectFields.forEach(select => {
      if(isRTL) {
        select.style.backgroundPosition = 'left 1rem center';
      } else {
        select.style.backgroundPosition = 'right 1rem center';
      }
    });
  }
  
  function toggleRTL() {
    if(htmlEl.getAttribute('dir') === 'rtl') {
      htmlEl.removeAttribute('dir');
      localStorage.setItem('direction', 'ltr');
      applyRTLStyles(false);
    } else {
      htmlEl.setAttribute('dir', 'rtl');
      localStorage.setItem('direction', 'rtl');
      applyRTLStyles(true);
    }
  }
  
  if(localStorage.getItem('direction') === 'rtl') {
    htmlEl.setAttribute('dir', 'rtl');
    applyRTLStyles(true);
  }
  
  rtlToggle?.addEventListener('click', () => {
    toggleRTL();
  });
  
  // Handle Register Form Submission
  function handleRegister(event) {
    event.preventDefault();
    
    const firstname = document.getElementById('firstname').value.trim();
    const lastname = document.getElementById('lastname').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const businessType = document.getElementById('business_type').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const terms = document.getElementById('terms').checked;
    
    // Validation
    if(!firstname) {
      showNotification('Please enter your first name', 'error');
      return false;
    }
    
    if(!lastname) {
      showNotification('Please enter your last name', 'error');
      return false;
    }
    
    if(!email) {
      showNotification('Please enter your email address', 'error');
      return false;
    }
    
    if(!email.includes('@') || !email.includes('.')) {
      showNotification('Please enter a valid email address', 'error');
      return false;
    }
    
    if(!password) {
      showNotification('Please create a password', 'error');
      return false;
    }
    
    if(password.length < 6) {
      showNotification('Password must be at least 6 characters', 'error');
      return false;
    }
    
    if(password !== confirmPassword) {
      showNotification('Passwords do not match', 'error');
      return false;
    }
    
    if(!terms) {
      showNotification('Please accept the Terms of Service', 'error');
      return false;
    }
    
    console.log('Registration:', { firstname, lastname, email, phone, businessType });
    
    // Show success message
    showNotification('Account created successfully! Redirecting to login...', 'success');
    
    // Store registration info
    localStorage.setItem('vendora_registered_email', email);
    
    // Redirect to login after 1.5 seconds
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1500);
    
    return false;
  }
  
  // Social Register Handler
  function socialRegister(event, provider) {
    event.preventDefault();
    showNotification(`${provider} sign up coming soon`, 'info');
  }
  
  // Notification System
  function showNotification(message, type = 'info') {
    const existingNotification = document.querySelector('.custom-notification');
    if(existingNotification) {
      existingNotification.remove();
    }
    
    const notification = document.createElement('div');
    notification.className = `custom-notification ${type}`;
    notification.innerHTML = `
      <div style="display: flex; align-items: center; gap: 10px;">
        <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
        <span>${message}</span>
      </div>
    `;
    
    notification.style.position = 'fixed';
    notification.style.bottom = '20px';
    notification.style.left = '50%';
    notification.style.transform = 'translateX(-50%)';
    notification.style.padding = '10px 20px';
    notification.style.borderRadius = '10px';
    notification.style.fontSize = '0.8rem';
    notification.style.fontWeight = '500';
    notification.style.zIndex = '1000';
    notification.style.minWidth = '250px';
    notification.style.textAlign = 'center';
    notification.style.boxShadow = '0 4px 15px rgba(0,0,0,0.2)';
    notification.style.backdropFilter = 'blur(10px)';
    notification.style.fontFamily = "'Inter', sans-serif";
    
    if(type === 'success') {
      notification.style.background = '#10b981';
      notification.style.color = '#ffffff';
    } else if(type === 'error') {
      notification.style.background = '#ef4444';
      notification.style.color = '#ffffff';
    } else {
      notification.style.background = 'var(--gold)';
      notification.style.color = '#0D0D0D';
    }
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
      notification.style.opacity = '0';
      notification.style.transition = 'opacity 0.3s';
      setTimeout(() => {
        if(notification.parentNode) notification.remove();
      }, 300);
    }, 2500);
  }
  
  // Password match validation on keyup
  const passwordField = document.getElementById('password');
  const confirmField = document.getElementById('confirm_password');
  
  function validatePasswordMatch() {
    if(confirmField.value.length > 0) {
      if(passwordField.value !== confirmField.value) {
        confirmField.style.borderColor = '#ef4444';
      } else {
        confirmField.style.borderColor = 'var(--gold)';
      }
    } else {
      confirmField.style.borderColor = 'var(--input-border)';
    }
  }
  
  passwordField?.addEventListener('keyup', validatePasswordMatch);
  confirmField?.addEventListener('keyup', validatePasswordMatch);
  
  // Enter key support
  const registerForm = document.getElementById('registerForm');
  if(registerForm) {
    registerForm.addEventListener('keypress', function(e) {
      if(e.key === 'Enter') {
        handleRegister(e);
      }
    });
  }
</script>

<style>
  /* RTL specific adjustments */
  [dir="rtl"] .input-group label .label-icon {
    margin-left: 6px;
    margin-right: 0;
  }
  
  [dir="rtl"] .checkbox {
    flex-direction: row-reverse;
    justify-content: flex-end;
  }
  
  [dir="rtl"] .checkbox input {
    margin-left: 8px;
    margin-right: 0;
  }
  
  [dir="rtl"] .btn-register i,
  [dir="rtl"] .social-btn i {
    margin-left: 8px;
    margin-right: 0;
  }
  
  [dir="rtl"] .demo-hint i {
    margin-left: 5px;
    margin-right: 0;
  }
  
  [dir="rtl"] .login-link a {
    margin-left: 0;
    margin-right: 4px;
  }
</style>

</body>
</html>
